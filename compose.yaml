services:
  notihub:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: notihub:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${NOTIHUB_PORT:-8080}:8080"
    environment:
      NOTIHUB_DB_PATH: /data/notihub.db
      NOTIHUB_SHUTDOWN_TIMEOUT: 10s
    volumes:
      - notihub-data:/data
    # Give in-flight requests a chance to finish before SIGKILL arrives.
    stop_grace_period: 15s

volumes:
  notihub-data:
